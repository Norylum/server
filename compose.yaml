name: norylum
services:
  server:
    image: norylum-server:local
    build:
      context: .
      dockerfile: Dockerfile
    user: "${NORYLUM_UID:?Run scripts/norylum-docker.sh setup}:${NORYLUM_GID:?Run scripts/norylum-docker.sh setup}"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Local only by default. Use an HTTPS reverse proxy for external access.
      - "127.0.0.1:${NORYLUM_PORT:-8120}:8120"
    environment:
      NORYLUM_MEDIA_DIR: /data/media
      NORYLUM_LISTEN_ADDR: 0.0.0.0:8120
      NORYLUM_INGEST_POLL_SECONDS: ${NORYLUM_INGEST_POLL_SECONDS:-15}
      NORYLUM_ADMIN_USERNAME: ${NORYLUM_ADMIN_USERNAME:-}
      RUST_LOG: ${NORYLUM_RUST_LOG:-info,norylum=debug}
    volumes:
      # Same host directory used before Docker, including SQLite WAL and media.
      - ./media:/data/media
      # Tokens/password are not stored in the Compose environment.
      - ./config:/run/norylum-config:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8120/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

  gluetun:
    profiles:
      - torrent
      - acquisition
      - vpn-test
    image: qmcgaw/gluetun:v3.41.3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Logs contain IPs and network activity; cap rotation to limit host disk use.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      VPN_SERVICE_PROVIDER: ${NORYLUM_VPN_PROVIDER:-protonvpn}
      VPN_TYPE: ${NORYLUM_VPN_TYPE:-wireguard}
      OPENVPN_PROTOCOL: ${NORYLUM_OPENVPN_PROTOCOL:-udp}
      SERVER_COUNTRIES: ${NORYLUM_VPN_COUNTRIES:-}
      SERVER_REGIONS: ${NORYLUM_VPN_REGIONS:-}
      VPN_PORT_FORWARDING: "off"
      # Gluetun defaults: DNS-over-TLS on 127.0.0.1, IPv6 firewall DROP,
      # all outbound traffic blocked unless it exits via the VPN tunnel.
      # These defaults are intentionally left implicit; document them here
      # so the security posture is explicit without overriding Gluetun's
      # version-specific safe defaults.
    volumes:
      - ./vpn-secrets:/run/secrets:ro
      - ./vpn-state:/gluetun

  seeder:
    profiles:
      - torrent
    network_mode: "service:gluetun"
    image: norylum-server:local
    depends_on:
      gluetun:
        condition: service_healthy
      server:
        condition: service_healthy
    user: "${NORYLUM_UID:?Run setup}:${NORYLUM_GID:?Run setup}"
    init: true
    restart: "no"
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - norylum-seeder
    environment:
      NORYLUM_MEDIA_DIR: /data/media
      RUST_LOG: ${NORYLUM_RUST_LOG:-info}
    volumes:
      - ./media:/data/media


  acquisition-worker:
    profiles:
      - acquisition
    network_mode: "service:gluetun"
    image: norylum-server:local
    depends_on:
      gluetun:
        condition: service_healthy
      server:
        condition: service_healthy
    user: "${NORYLUM_UID:?Run setup}:${NORYLUM_GID:?Run setup}"
    init: true
    restart: "no"
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - norylum-acquisition-worker
      - --run
    environment:
      NORYLUM_MEDIA_DIR: /data/media
      RUST_LOG: ${NORYLUM_RUST_LOG:-info}
    volumes:
      - ./media:/data/media

  norylum-web:
    profiles:
      - web
    build:
      context: apps/norylum-web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  vpn-probe:
    profiles:
      - vpn-test
    image: norylum-server:local
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    user: "${NORYLUM_UID:?Run setup}:${NORYLUM_GID:?Run setup}"
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - curl
      - --ipv4
      - --noproxy
      - "*"
      - --fail
      - --silent
      - --show-error
      - --max-time
      - "15"
      - https://api.ipify.org

  maintenance:
    profiles:
      - maintenance
    image: norylum-server:local
    network_mode: "none"
    user: "${NORYLUM_UID:?Run setup}:${NORYLUM_GID:?Run setup}"
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command:
      - norylum-torrent-cleanup
    environment:
      NORYLUM_MEDIA_DIR: /data/media
    volumes:
      - ./media:/data/media
